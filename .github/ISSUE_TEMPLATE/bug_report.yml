name: Bug report
description: Report a reproducible defect without disclosing private source or secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit vulnerabilities, private repositories, secrets, or personal data here.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened using a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, filesystem, and Rust version; redact identifying paths.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, private source, personal data, and identifying paths.
          required: true
