name: Release candidate rehearsal

on:
  workflow_dispatch:

env:
  # GitHub binds this value to the ref selected when the workflow is dispatched.
  # It is not supplied through a free-form workflow input.
  SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate workflow source identity
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Run complete gate
        shell: bash
        run: ./scripts/check.sh
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --offline --bins
      - name: Package exact candidate
        shell: bash
        run: ruby scripts/package-release.rb "${{ matrix.target }}" dist "$SOURCE_SHA"
      - name: Rehearse clean installation
        shell: bash
        run: ruby scripts/rehearse-release.rb "dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz"
      - name: Confirm tracked workspace unchanged
        shell: bash
        run: test -z "$(git status --short --untracked-files=no)"
      - name: Upload candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impresari-context-0.1.0-${{ matrix.target }}
          path: |
            dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz
            dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
