name: Release candidate rehearsal

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to build
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate requested source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Run complete gate
        shell: bash
        run: ./scripts/check.sh
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --offline --bins
      - name: Package exact candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: ruby scripts/package-release.rb "${{ matrix.target }}" dist "$SOURCE_SHA"
      - name: Rehearse clean installation
        shell: bash
        run: ruby scripts/rehearse-release.rb "dist/impresari-context-0.0.0-${{ matrix.target }}.tar.gz"
      - name: Confirm tracked workspace unchanged
        shell: bash
        run: test -z "$(git status --short --untracked-files=no)"
      - name: Upload candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impresari-context-0.0.0-${{ matrix.target }}
          path: |
            dist/impresari-context-0.0.0-${{ matrix.target }}.tar.gz
            dist/impresari-context-0.0.0-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
