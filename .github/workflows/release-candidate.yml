name: Release candidate rehearsal

on:
  workflow_dispatch:

env:
  # GitHub binds this value to the ref selected when the workflow is dispatched.
  # It is not supplied through a free-form workflow input.
  SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  package:
    name: Package / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate workflow source identity
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Run complete gate
        shell: bash
        run: ./scripts/check.sh
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --offline --bins
      - name: Package exact candidate
        shell: bash
        run: ruby scripts/package-release.rb "${{ matrix.target }}" dist "$SOURCE_SHA"
      - name: Rehearse clean installation
        shell: bash
        run: ruby scripts/rehearse-release.rb "dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz"
      - name: Rehearse Linux A+C package lifecycle
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          baseline_dir="$RUNNER_TEMP/impresari-v0.1.0-baseline"
          reports_dir="dist/linux-package-lifecycle"
          baseline_name="impresari-context-0.1.0-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$baseline_dir" "$reports_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$baseline_dir/$baseline_name" \
            "https://github.com/tdloB/impresari-context/releases/download/v0.1.0/$baseline_name"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$baseline_dir/$baseline_name.sha256" \
            "https://github.com/tdloB/impresari-context/releases/download/v0.1.0/$baseline_name.sha256"
          for profile in rootless_user_manager externally_managed; do
            ruby scripts/linux-package-lifecycle-rehearsal.rb \
              --profile "$profile" \
              --baseline "$baseline_dir/$baseline_name" \
              --candidate "dist/$baseline_name" \
              --candidate-source-sha "$SOURCE_SHA" \
              > "$reports_dir/$profile.json"
          done
          ruby -rjson -e '
            rootless = JSON.parse(File.read(ARGV.fetch(0)))
            external = JSON.parse(File.read(ARGV.fetch(1)))
            abort "rootless login gate drifted" unless rootless["status"] == "package_lifecycle_partial" && rootless["reentry_evidence"] == "real_login_session_required"
            abort "external package candidate missing" unless external["status"] == "package_lifecycle_candidate" && external["reentry_evidence"] == "operator_relaunch_verified"
            abort "package rehearsal overclaimed" unless [rootless, external].all? { |receipt| receipt.fetch("claims").values.none? }
          ' "$reports_dir/rootless_user_manager.json" "$reports_dir/externally_managed.json"
      - name: Confirm tracked workspace unchanged
        shell: bash
        run: test -z "$(git status --short --untracked-files=no)"
      - name: Upload candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impresari-context-0.1.0-${{ matrix.target }}
          path: |
            dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz
            dist/impresari-context-0.1.0-${{ matrix.target }}.tar.gz.sha256
            dist/linux-package-lifecycle/*.json
          if-no-files-found: error
          retention-days: 7
