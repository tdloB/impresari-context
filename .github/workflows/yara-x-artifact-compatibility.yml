name: YARA-X synthetic artifact compatibility

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: yara-x-artifact-compatibility
  cancel-in-progress: false

env:
  SOURCE_SHA: 892110789a73c8944a6c4c4258508bf36dd6c75e
  SOURCE_ARCHIVE_BYTES: "27932605"
  SOURCE_ARCHIVE_SHA256: cb6c97e0a806c74722995e8a1c9b6ca5cd44ed3393020e5ebe7af5daf3cefa1f

jobs:
  rehearse:
    name: YARA-X v1.20.0 / Ubuntu 24.04 x86-64 synthetic only
    if: github.repository == 'tdloB/impresari-context' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Prepare exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_ENVIRONMENT" = github-hosted
          archive="$RUNNER_TEMP/impresari-context-source.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://codeload.github.com/tdloB/impresari-context/tar.gz/$SOURCE_SHA"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$SOURCE_ARCHIVE_BYTES"
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$SOURCE_ARCHIVE_SHA256"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          tar -xzf "$archive" --no-same-owner --no-same-permissions \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
          rm -f -- "$archive"
          test "$(sha256sum profiles/v1/yara-x-artifact-compatibility-v1.json | cut -d ' ' -f 1)" = \
            ea2abe8460a1faab60b4ab2d854e48bdd45f1998106cd5e62229153155d254a8
      - name: Install exact Rust toolchains
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup toolchain install 1.98.0 --profile minimal
      - name: Install exact dependency auditor
        run: cargo +1.93.0 install cargo-audit --version 0.22.2 --locked
      - name: Build and run the isolated synthetic compatibility corpus
        run: ./scripts/yara-x-artifact-compatibility.sh
      - name: Verify ephemeral cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/impresari-yara-x-compatibility-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e target/yara-x-artifact-compatibility
          test ! -e target/iar-linux-composite-feasibility/yara-x
          test -z "$(find target -type f \( -name yr -o -name '*.yarc' \) -print -quit)"
