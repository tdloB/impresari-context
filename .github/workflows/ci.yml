name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust: 1.98.0
            target: aarch64-apple-darwin
            filesystem: hosted-macos-apfs-profile
          - os: ubuntu-24.04
            rust: 1.98.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
          - os: windows-2025
            rust: 1.98.0
            target: x86_64-pc-windows-msvc
            filesystem: hosted-windows-ntfs-profile
          - os: ubuntu-24.04
            rust: 1.96.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
          - os: ubuntu-24.04
            rust: 1.97.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Run quality checks
        shell: bash
        run: ./scripts/check.sh
      - name: Record bounded platform evidence
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          FILESYSTEM_PROFILE: ${{ matrix.filesystem }}
        run: ruby ./scripts/platform-evidence.rb | tee -a "$GITHUB_STEP_SUMMARY"
