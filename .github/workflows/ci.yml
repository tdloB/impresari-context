name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust: 1.98.0
          - os: ubuntu-24.04
            rust: 1.98.0
          - os: windows-2025
            rust: 1.98.0
          - os: ubuntu-24.04
            rust: 1.96.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"
      - name: Run quality checks
        shell: bash
        run: ./scripts/check.sh
