name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  windows-basecontainer-capability:
    name: Windows BaseContainer no-worker capability
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Observe the no-worker BaseContainer capability
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_WINDOWS_RUNNER: windows-11-arm
        run: |
          rustfmt --check platform/windows-native-feasibility/windows-basecontainer-capability-probe.rs
          rustc --edition=2024 -D warnings platform/windows-native-feasibility/windows-basecontainer-capability-probe.rs -o "$RUNNER_TEMP/windows-basecontainer-capability-probe.exe"
          cd "$RUNNER_TEMP"
          ./windows-basecontainer-capability-probe.exe > windows-basecontainer-capability.json
          ruby "$GITHUB_WORKSPACE/scripts/check-windows-basecontainer-capability-contract.rb" --receipt "$RUNNER_TEMP/windows-basecontainer-capability.json" | tee -a "$GITHUB_STEP_SUMMARY"

  windows-native-iar:
    name: Windows native IAR-1B synthetic candidate
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup override set 1.98.0
      - name: Compile and run the no-worker native preflight
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_WINDOWS_RUNNER: windows-2025
        run: |
          rustfmt --check platform/windows-native-feasibility/windows-native-capability-probe.rs
          rustc --edition=2024 -D warnings platform/windows-native-feasibility/windows-native-capability-probe.rs -o "$RUNNER_TEMP/windows-native-capability-probe.exe"
          "$RUNNER_TEMP/windows-native-capability-probe.exe" > "$RUNNER_TEMP/windows-native-capability-preflight.json"
          ruby scripts/check-windows-native-feasibility-contract.rb --receipt "$RUNNER_TEMP/windows-native-capability-preflight.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile and run the fixed synthetic-worker matrix
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EXPECTED_WINDOWS_RUNNER: windows-2025
        run: |
          rustfmt --check platform/windows-native-feasibility/windows-native-synthetic-broker.rs
          rustfmt --check platform/windows-native-feasibility/windows-native-synthetic-worker.rs
          rustc --edition=2024 -D warnings platform/windows-native-feasibility/windows-native-synthetic-worker.rs -o "$RUNNER_TEMP/windows-native-synthetic-worker.exe"
          rustc --edition=2024 -D warnings platform/windows-native-feasibility/windows-native-synthetic-broker.rs -o "$RUNNER_TEMP/windows-native-synthetic-broker.exe"
          export EXPECTED_WORKER_SHA256
          EXPECTED_WORKER_SHA256=$(sha256sum < "$RUNNER_TEMP/windows-native-synthetic-worker.exe" | cut -d ' ' -f 1)
          export EXPECTED_BROKER_SHA256
          EXPECTED_BROKER_SHA256=$(sha256sum < "$RUNNER_TEMP/windows-native-synthetic-broker.exe" | cut -d ' ' -f 1)
          "$RUNNER_TEMP/windows-native-synthetic-broker.exe" > "$RUNNER_TEMP/windows-native-synthetic-worker-matrix.json"
          ruby scripts/check-windows-native-synthetic-worker-contract.rb --receipt "$RUNNER_TEMP/windows-native-synthetic-worker-matrix.json" | tee -a "$GITHUB_STEP_SUMMARY"

  linux-external-iar:
    name: Linux externally managed IAR-1B candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run inherited-capability external delegation rehearsal
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/linux-external-delegation-live-rehearsal.sh | tee -a "$GITHUB_STEP_SUMMARY"

  linux-arm64-iar:
    name: Linux arm64 IAR-1B candidate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record no-sudo rootless host preflight
        shell: bash
        run: ruby ./scripts/linux-rootless-host-preflight.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run no-sudo rootless user-manager rehearsal
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ruby ./scripts/linux-rootless-user-manager-rehearsal.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Linux primitive feasibility check
        shell: bash
        run: ./scripts/check-linux-isolation-feasibility.sh
      - name: Run Linux arm64 composite feasibility check
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/check-linux-composite-feasibility.sh

  linux-kernel-iar:
    name: Linux IAR-1B candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record no-sudo rootless host preflight
        shell: bash
        run: ruby ./scripts/linux-rootless-host-preflight.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run no-sudo rootless user-manager rehearsal
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ruby ./scripts/linux-rootless-user-manager-rehearsal.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Linux primitive feasibility check
        shell: bash
        run: ./scripts/check-linux-isolation-feasibility.sh
      - name: Run Linux composite feasibility check
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/check-linux-composite-feasibility.sh

  dependency-audit:
    name: Dependency security and licenses
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install pinned audit tools
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies and licenses
        shell: bash
        run: ./scripts/audit-dependencies.sh

  quality:
    name: Quality / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust: 1.98.0
            target: aarch64-apple-darwin
            filesystem: hosted-macos-apfs-profile
          - os: ubuntu-24.04
            rust: 1.98.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
          - os: windows-2025
            rust: 1.98.0
            target: x86_64-pc-windows-msvc
            filesystem: hosted-windows-ntfs-profile
          - os: ubuntu-24.04
            rust: 1.96.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
          - os: ubuntu-24.04
            rust: 1.97.0
            target: x86_64-unknown-linux-gnu
            filesystem: hosted-ubuntu-local-filesystem
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
          rustup override set "${{ matrix.rust }}"
      - name: Fetch locked dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "cargo fetch --locked failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Run quality checks
        shell: bash
        run: ./scripts/check.sh
      - name: Run macOS App Sandbox/XPC feasibility check
        if: matrix.os == 'macos-14' && matrix.rust == '1.98.0'
        shell: bash
        run: ./scripts/check-macos-xpc-feasibility.sh
      - name: Run Linux IAR-1B feasibility check
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == '1.98.0'
        shell: bash
        run: ./scripts/check-linux-isolation-feasibility.sh
      - name: Record no-sudo rootless host preflight
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == '1.98.0'
        shell: bash
        run: ruby ./scripts/linux-rootless-host-preflight.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run no-sudo rootless user-manager rehearsal
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == '1.98.0'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ruby ./scripts/linux-rootless-user-manager-rehearsal.rb | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run Linux composite IAR-1B feasibility check
        if: matrix.os == 'ubuntu-24.04' && matrix.rust == '1.98.0'
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: ./scripts/check-linux-composite-feasibility.sh
      - name: Record bounded platform evidence
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          FILESYSTEM_PROFILE: ${{ matrix.filesystem }}
        run: ruby ./scripts/platform-evidence.rb | tee -a "$GITHUB_STEP_SUMMARY"
