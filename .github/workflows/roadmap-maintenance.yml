name: Roadmap maintenance

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: roadmap-maintenance
  cancel-in-progress: false

jobs:
  observe:
    name: Source-free maintenance observation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out exact default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Observe allowlisted client metadata
        shell: bash
        run: |
          checked_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ruby scripts/roadmap-maintenance-observe.rb \
            --checked-at "$checked_at" \
            > "$RUNNER_TEMP/observations.json"
      - name: Evaluate released compatibility evidence
        shell: bash
        run: |
          as_of="$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("observations").fetch(0).fetch("checked_at").split("T", 2).fetch(0)' "$RUNNER_TEMP/observations.json")"
          ruby scripts/roadmap-maintenance-evaluate.rb \
            --observations "$RUNNER_TEMP/observations.json" \
            --as-of "$as_of" \
            > "$RUNNER_TEMP/receipts.json"
          ruby -rjson -e '
            receipts = JSON.parse(File.read(ARGV.fetch(0))).fetch("receipts")
            receipts.each do |receipt|
              puts "#{receipt.fetch("component_id")}: #{receipt.fetch("status")} (#{receipt.fetch("reason_code")})"
            end
          ' "$RUNNER_TEMP/receipts.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded maintenance receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roadmap-maintenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/observations.json
            ${{ runner.temp }}/receipts.json
          if-no-files-found: error
          retention-days: 7

  reconcile-issues:
    name: Exact-owned issue reconciliation
    needs: observe
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out issue adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download bounded maintenance receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: roadmap-maintenance-${{ github.sha }}
          path: ${{ runner.temp }}/maintenance
      - name: Ensure exact-owned maintenance label
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create impresari-maintenance --color 5319e7 --description "Exact-owned scheduled maintenance" --force
      - name: Read only exact-owned issue state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --state all \
            --label impresari-maintenance \
            --limit 100 \
            --json number,title,body,state,labels \
            > "$RUNNER_TEMP/maintenance/existing.json"
      - name: Build deterministic issue plan
        shell: bash
        run: |
          ruby scripts/roadmap-maintenance-issue-plan.rb \
            --receipts "$RUNNER_TEMP/maintenance/receipts.json" \
            --existing "$RUNNER_TEMP/maintenance/existing.json" \
            > "$RUNNER_TEMP/maintenance/issue-plan.json"
      - name: Apply exact-owned issue plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby scripts/roadmap-maintenance-issue-apply.rb \
            --plan "$RUNNER_TEMP/maintenance/issue-plan.json" \
            >> "$GITHUB_STEP_SUMMARY"
