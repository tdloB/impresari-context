name: YARA-X retained Linux engine candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: yara-x-retained-engine-candidate
  cancel-in-progress: false

env:
  ARTIFACT_NAME: yara-x-v1.20.0-linux-x86_64-engine-candidate

jobs:
  build:
    name: Build one unadmitted YARA-X Linux x86-64 candidate
    if: github.repository == 'tdloB/impresari-context' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      archive_bytes: ${{ steps.package.outputs.archive_bytes }}
      executable_sha256: ${{ steps.package.outputs.executable_sha256 }}
      executable_bytes: ${{ steps.package.outputs.executable_bytes }}
      sbom_sha256: ${{ steps.package.outputs.sbom_sha256 }}
      provenance_sha256: ${{ steps.package.outputs.provenance_sha256 }}
    steps:
      - name: Prepare exact public Impresari source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = tdloB/impresari-context
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          archive="$RUNNER_TEMP/impresari-context-source.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://codeload.github.com/tdloB/impresari-context/tar.gz/$GITHUB_SHA"
          test "$(wc -c < "$archive" | tr -d ' ')" -le 67108864
          sha256sum "$archive"
          tar -xzf "$archive" --no-same-owner --no-same-permissions \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
          rm -f -- "$archive"
          test "$(sha256sum profiles/v1/yara-x-retained-engine-candidate-v1.json | cut -d ' ' -f 1)" = \
            c0fbe929ccb253eda0a93fc9adee77a4d9ca28827bd21bbdaaab7820874c71da

      - name: Build and package exact candidate
        id: package
        shell: bash
        run: bash ./scripts/yara-x-retained-engine-candidate.sh

      - name: Upload exactly one authenticated non-release seven-day candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yara-x-v1.20.0-linux-x86_64-engine-candidate
          path: target/yara-x-retained-engine-candidate/yara-x-v1.20.0-linux-x86_64-engine-candidate.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Verify build-job cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/impresari-yara-x-retained-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- target/yara-x-retained-engine-candidate
          test -z "$(find target -type f -name yr -print -quit 2>/dev/null || true)"

  verify:
    name: Verify hashes, members, SBOM, and closed candidate without execution
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMPRESARI_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - name: Prepare exact public verifier without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = tdloB/impresari-context
          test "$RUNNER_ENVIRONMENT" = github-hosted
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          archive="$RUNNER_TEMP/impresari-context-verifier-source.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://codeload.github.com/tdloB/impresari-context/tar.gz/$GITHUB_SHA"
          test "$(wc -c < "$archive" | tr -d ' ')" -le 67108864
          sha256sum "$archive"
          tar -xzf "$archive" --no-same-owner --no-same-permissions \
            --strip-components=1 -C "$GITHUB_WORKSPACE"
          rm -f -- "$archive"
          test "$(sha256sum profiles/v1/yara-x-retained-engine-candidate-v1.json | cut -d ' ' -f 1)" = \
            c0fbe929ccb253eda0a93fc9adee77a4d9ca28827bd21bbdaaab7820874c71da

      - name: Download the one same-run candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yara-x-v1.20.0-linux-x86_64-engine-candidate
          path: ${{ runner.temp }}/candidate

      - name: Verify without extracting or executing candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$IMPRESARI_ARTIFACT_ID" -gt 0
          candidate="$RUNNER_TEMP/candidate/yara-x-v1.20.0-linux-x86_64-engine-candidate.tar.gz"
          test -f "$candidate" && test ! -L "$candidate"
          test "$(find "$RUNNER_TEMP/candidate" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          receipt="$RUNNER_TEMP/yara-x-retained-engine-candidate-verification.json"
          ruby ./scripts/verify-yara-x-retained-engine-candidate.rb "$candidate" "$receipt"
          ruby -rjson -e '
            value = JSON.parse(File.read(ARGV.fetch(0)))
            abort "verification receipt overclaimed" if value.fetch("claims").values.any?
            abort "verification receipt is not closed" unless value.fetch("verified") && value.fetch("member_count") == 12
          ' "$receipt"
          cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' \
            "YARA-X candidate same-run receipt: artifact_id=$IMPRESARI_ARTIFACT_ID archive=${{ needs.build.outputs.archive_sha256 }} bytes=${{ needs.build.outputs.archive_bytes }} executable=${{ needs.build.outputs.executable_sha256 }} sbom=${{ needs.build.outputs.sbom_sha256 }} provenance=${{ needs.build.outputs.provenance_sha256 }} executed=false admitted=false production=false iar_2=false"

      - name: Verify verifier-job cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/candidate"
          rm -f -- "$RUNNER_TEMP/yara-x-retained-engine-candidate-verification.json"
          test ! -e "$RUNNER_TEMP/candidate"
          test ! -e "$RUNNER_TEMP/yara-x-retained-engine-candidate-verification.json"
