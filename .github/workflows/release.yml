name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected release tag to publish
        required: true
        default: v0.1.0

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, commit, and manifest version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          grep -Fq "version = \"$version\"" Cargo.toml
          grep -Fq "## [$version] - " CHANGELOG.md
          if grep -Fq "## [$version] - Unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md still marks $version as unreleased" >&2
            exit 2
          fi
          ruby scripts/enforce-v0-2-independent-review-release-gate.rb "$RELEASE_TAG" "$SOURCE_SHA"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package / ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Run complete gate
        shell: bash
        run: ./scripts/check.sh
      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --offline --bins
      - name: Package exact release
        shell: bash
        run: ruby scripts/package-release.rb "${{ matrix.target }}" dist "$SOURCE_SHA"
      - name: Rehearse clean installation
        shell: bash
        run: ruby scripts/rehearse-release.rb "dist/impresari-context-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/impresari-context-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/impresari-context-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: [validate, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Stage versioned installer
        shell: bash
        run: |
          cp scripts/install.sh dist/impresari-context-install.sh
          chmod 0755 dist/impresari-context-install.sh
          cd dist
          sha256sum impresari-context-install.sh > impresari-context-install.sh.sha256
      - name: Verify checksums
        shell: bash
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/impresari-context-install.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file CHANGELOG.md
