name: Rust fuzzing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-fuzz:
    name: Context packet fuzz target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Install pinned cargo-fuzz
        shell: bash
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Verify fuzz dependency lockfile
        shell: bash
        run: cargo +nightly-2026-08-01 check --manifest-path fuzz/Cargo.toml --locked

      - name: Run bounded fuzz campaign
        shell: bash
        run: cargo +nightly-2026-08-01 fuzz run context_packet -- -max_total_time=60 -max_len=1048576

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context-packet-fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
