[package]
name = "context-evaluation"
description = "Reproducible Impresari Context evaluation harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-core = { version = "=0.0.0", path = "../context-core" }
context-engine = { version = "=0.0.0", path = "../context-engine" }
context-store = { version = "=0.0.0", path = "../context-store" }
context-workspace = { version = "=0.0.0", path = "../context-workspace" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[[bin]]
name = "impresari-context-eval"
path = "src/main.rs"
