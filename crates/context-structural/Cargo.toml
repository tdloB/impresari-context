[package]
name = "context-structural"
description = "Isolated structural parser protocol and bounded source-language structural resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
tree-sitter = { version = "=0.26.12", default-features = false, features = ["std"] }
tree-sitter-c-sharp = { version = "=0.23.5", default-features = false }
tree-sitter-java = { version = "=0.23.5", default-features = false }
tree-sitter-javascript = { version = "=0.25.0", default-features = false }
tree-sitter-kotlin-ng = { version = "=1.1.0", default-features = false }
tree-sitter-json = { version = "=0.24.8", default-features = false }
tree-sitter-python = { version = "=0.25.0", default-features = false }
tree-sitter-rust = { version = "=0.24.2", default-features = false }
tree-sitter-toml-ng = { version = "=0.7.0", default-features = false }
tree-sitter-yaml = { version = "=0.7.2", default-features = false }
tree-sitter-go = { version = "=0.25.0", default-features = false }
tree-sitter-typescript = { version = "=0.23.2", default-features = false }

[[bin]]
name = "impresari-context-structural-worker"
path = "src/main.rs"
