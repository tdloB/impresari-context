[package]
name = "context-dashboard-server"
description = "Foreground loopback-only dashboard delivery for Impresari Context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-dashboard = { version = "=0.1.0", path = "../context-dashboard" }
context-store = { version = "=0.1.0", path = "../context-store" }
getrandom = { version = "=0.3.4", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
context-core = { version = "=0.1.0", path = "../context-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
