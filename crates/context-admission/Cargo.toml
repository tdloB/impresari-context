[package]
name = "context-admission"
description = "Evidence-only hostile-repository admission contracts and inventory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-core = { version = "=0.1.0", path = "../context-core" }
context-workspace = { version = "=0.1.0", path = "../context-workspace" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
jsonschema = { version = "=0.50.0", default-features = false }
