[package]
name = "context-admission"
description = "Evidence-only hostile-repository inventory, observations, coverage, and assessment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
context-core = { version = "=0.2.0", path = "../context-core" }
context-extensions = { version = "=0.2.0", path = "../context-extensions" }
context-workspace = { version = "=0.2.0", path = "../context-workspace" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
jsonschema = { version = "=0.52.0", default-features = false }
