[package]
name = "context-cli"
description = "Local command-line interface for Impresari Context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-core = { version = "=0.1.0", path = "../context-core" }
context-engine = { version = "=0.1.0", path = "../context-engine" }
context-mcp = { version = "=0.1.0", path = "../context-mcp" }
context-session = { version = "=0.1.0", path = "../context-session" }
context-store = { version = "=0.1.0", path = "../context-store" }
context-structural = { version = "=0.1.0", path = "../context-structural" }
context-workspace = { version = "=0.1.0", path = "../context-workspace" }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[[bin]]
name = "impresari-context"
path = "src/main.rs"
