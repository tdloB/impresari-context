[package]
name = "context-dashboard"
description = "Local metadata projection and narrowing-only budget policy for Impresari Context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-core = { version = "=0.2.0", path = "../context-core" }
context-store = { version = "=0.2.0", path = "../context-store" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
