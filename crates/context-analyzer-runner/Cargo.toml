[package]
name = "context-analyzer-runner"
description = "Application-enforced synthetic staging and process supervision for ADR-0074 IAR-1A"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
context-analyzer-protocol = { path = "../context-analyzer-protocol", version = "=0.2.0" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[[bin]]
name = "impresari-context-analyzer-synthetic-worker"
path = "src/main.rs"

[[bin]]
name = "impresari-context-macos-vm-synthetic-supervisor"
path = "src/macos_vm_supervisor.rs"
