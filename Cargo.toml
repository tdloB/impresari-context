[workspace]
members = [
    "crates/context-cli",
    "crates/context-codex-app-server",
    "crates/context-copilot-cli",
    "crates/context-claude-code",
    "crates/context-cursor-agent",
    "crates/context-vscode-copilot",
    "crates/context-adapters",
    "crates/context-admission",
    "crates/context-admission-policy",
    "crates/context-analyzer-protocol",
    "crates/context-analyzer-runner",
    "crates/context-conformance",
    "crates/context-core",
    "crates/context-engine",
    "crates/context-extensions",
    "crates/context-mcp",
    "crates/context-evaluation",
    "crates/context-retrieval",
    "crates/context-reference-client",
    "crates/context-session",
    "crates/context-store",
    "crates/context-structural",
    "crates/context-workspace",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/tdloB/impresari-context"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
