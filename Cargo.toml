[workspace]
members = [
    "crates/context-cli",
    "crates/context-conformance",
    "crates/context-core",
    "crates/context-engine",
    "crates/context-evaluation",
    "crates/context-retrieval",
    "crates/context-session",
    "crates/context-store",
    "crates/context-structural",
    "crates/context-workspace",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/OWNER/impresari-context"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
